<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PCB generator test</title>
<style>
  html, body { margin: 0; background: #02060d; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage svg { display: block; width: 100%; height: 100%; }
  #panel {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    font: 12px/1.5 ui-monospace, monospace; color: #8fd0e8;
    background: rgba(4, 12, 22, 0.85); padding: 8px 10px; border-radius: 6px;
    border: 1px solid rgba(90, 160, 210, 0.3);
  }
  #panel button { font: inherit; margin-right: 6px; cursor: pointer;
    background: #0d2233; color: #bfe8f5; border: 1px solid #2a5568; border-radius: 4px; padding: 3px 8px; }
  #panel label { display: inline-block; margin: 2px 8px 2px 0; }
  #panel input { width: 46px; background: #071722; color: #cfe; border: 1px solid #244; border-radius: 3px; }
  #stat { opacity: 0.8; }
</style>
</head>
<body>
<div id="panel">
  <button id="regen">regenerate (r)</button>
  <span id="stat"></span><br />
  <label>components <input id="cp" type="number" value="-1" step="1" title="-1 = auto"></label>
  <label>pitch <input id="pitch" type="number" value="11" step="1" title="px between pins along an edge"></label>
  <label>standoff <input id="standoff" type="number" value="7" step="1" title="px pins sit outside the body"></label>
</div>
<div id="stage"></div>
<script src="/static/js/pcb-gen.js?v=10"></script>
<script>
  const stage = document.getElementById('stage');
  const stat = document.getElementById('stat');
  let seed = 1;
  const num = (id) => parseFloat(document.getElementById(id).value);

  function run() {
    const w = innerWidth, h = innerHeight;
    const opts = { seed, pitch: num('pitch'), standoff: num('standoff') };
    if (num('cp') >= 0) opts.components = num('cp');
    const t0 = performance.now();
    const g = PCB.generate(w, h, opts);
    const genMs = Math.round(performance.now() - t0);
    const svg = PCB.render(g);
    stage.replaceChildren(svg);
    stat.textContent = `${g.traces.length} traces · ${g.vias.length} vias · ${g.comps.length} comps · ${genMs}ms · seed ${seed}`;
  }

  document.getElementById('regen').addEventListener('click', () => { seed = (seed * 1664525 + 1013904223) >>> 0; run(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'r') { seed = (seed * 1664525 + 1013904223) >>> 0; run(); } });
  document.querySelectorAll('#panel input').forEach((i) => i.addEventListener('change', run));
  addEventListener('resize', () => { clearTimeout(window._t); window._t = setTimeout(run, 250); });
  run();
</script>
</body>
</html>
